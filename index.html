<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taipei Recs Mobile Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #f8f9fa;
        }

        /* Responsive Layout Container (Stacked Vertically for Mobile) */
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Map Container (Takes up initial top portion) */
        #map-container {
            flex: 1;
            position: relative;
            width: 100%;
            min-height: 25vh;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Draggable Resizing Divider / Handle */
        #drag-handle {
            height: 24px;
            background: #ffffff;
            border-top: 1px solid #e0e0e0;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: ns-resize;
            touch-action: none;
            z-index: 1001;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.05);
        }

        .handle-bar {
            width: 36px;
            height: 4px;
            background: #ccc;
            border-radius: 2px;
        }

        /* Drawer / List Panel (Bottom Portion) */
        #list-panel {
            height: 45vh; /* Default mobile height */
            min-height: 15vh;
            max-height: 75vh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .panel-header {
            padding: 10px 16px;
            background: #1a252f;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h2 {
            font-size: 16px;
        }

        .filter-container {
            padding: 8px 16px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
        }

        .filter-container select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
            background: #fff;
        }

        .place-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            -webkit-overflow-scrolling: touch;
        }

        .place-item {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.15s;
            margin-bottom: 4px;
        }

        .place-item:active {
            background-color: #e8f0fe;
        }

        .place-item h4 {
            font-size: 15px;
            color: #2c3e50;
            margin-bottom: 3px;
        }

        .place-item p {
            font-size: 12px;
            color: #666;
            line-height: 1.35;
        }

        .category-badge {
            display: inline-block;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
            margin-top: 6px;
            text-transform: uppercase;
        }

        /* Location Button */
        #locate-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 1000;
            background: #ffffff;
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: bold;
            color: #2c3e50;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Marker Styles */
        .custom-pin {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            color: #fff;
            text-align: center;
            line-height: 28px;
            font-size: 13px;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .gold-star-marker {
            background-color: #FFD700;
            border: 2px solid #B8860B;
            border-radius: 50%;
            color: #000;
            text-align: center;
            line-height: 32px;
            font-size: 16px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.9), 0 2px 5px rgba(0,0,0,0.4);
        }

        .popup-title { font-size: 14px; font-weight: bold; color: #2c3e50; margin-bottom: 4px; }
        .popup-desc { font-size: 12px; color: #555; margin-bottom: 6px; line-height: 1.3; }
        .gmaps-link { font-size: 12px; color: #1a73e8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Map Panel (Top) -->
        <div id="map-container">
            <button id="locate-btn" onclick="locateUser()">
                <i class="fa-solid fa-location-crosshairs"></i> Find Me
            </button>
            <div id="map"></div>
        </div>

        <!-- Draggable Resizer Bar -->
        <div id="drag-handle">
            <div class="handle-bar"></div>
        </div>

        <!-- List Drawer (Bottom) -->
        <div id="list-panel">
            <div class="panel-header">
                <h2>Taipei Recs</h2>
                <span style="font-size: 11px; opacity: 0.8;">Drag bar to resize</span>
            </div>
            <div class="filter-container">
                <select id="category-filter" onchange="filterCategory(this.value)">
                    <option value="ALL">Show All Categories</option>
                    <option value="Hotel">⭐ Base (Grand Hyatt)</option>
                    <option value="Cocktail Bars & Speakeasies">🍸 Bars & Speakeasies</option>
                    <option value="Seafood & Japanese Dining">🍣 Seafood & Japanese</option>
                    <option value="Hotpot, Eats & Late-Night">🍲 Hotpot & Eats</option>
                    <option value="Sights & Attractions">🛍️ Sights & Day Trips</option>
                    <option value="Wellness & Transit">💆 Wellness & Transit</option>
                </select>
            </div>
            <div class="place-list" id="place-list"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const categoryColors = {
            "Hotel": "#FFD700",
            "Cocktail Bars & Speakeasies": "#8E44AD",
            "Seafood & Japanese Dining": "#2980B9",
            "Hotpot, Eats & Late-Night": "#E67E22",
            "Sights & Attractions": "#27AE60",
            "Wellness & Transit": "#16A085"
        };

        const categoryIcons = {
            "Hotel": "fa-star",
            "Cocktail Bars & Speakeasies": "fa-martini-glass-citrus",
            "Seafood & Japanese Dining": "fa-fish",
            "Hotpot, Eats & Late-Night": "fa-utensils",
            "Sights & Attractions": "fa-camera",
            "Wellness & Transit": "fa-spa"
        };

        const places = [
            { name: "Grand Hyatt Taipei (台北君悅酒店)", category: "Hotel", lat: 25.0357, lng: 121.5614, desc: "5-star luxury hotel in Xinyi District, adjacent to Taipei 101.", gmaps: "https://www.google.com/maps/search/?api=1&query=Grand+Hyatt+Taipei" },
            { name: "Tei by obon 🍸", category: "Cocktail Bars & Speakeasies", lat: 25.0336, lng: 121.5582, desc: "Hidden tea-cocktail speakeasy with an immersive entrance near Grand Hyatt.", gmaps: "https://www.google.com/maps/search/?api=1&query=Tei+by+obon+Taipei" },
            { name: "Bar Pun 🍸", category: "Cocktail Bars & Speakeasies", lat: 25.0331, lng: 121.5539, desc: "Speakeasy tucked down an alley specializing in aroma-driven sensory cocktails.", gmaps: "https://www.google.com/maps/search/?api=1&query=Bar+Pun+Taipei" },
            { name: "Akira 🍸", category: "Cocktail Bars & Speakeasies", lat: 25.0332, lng: 121.5541, desc: "Intimate speakeasy located right next door to Bar Pun.", gmaps: "https://www.google.com/maps/search/?api=1&query=Akira+Bar+Taipei" },
            { name: "WA-SHU 和酒 🍸", category: "Cocktail Bars & Speakeasies", lat: 25.0428, lng: 121.5489, desc: "Japanese cocktail lab focusing on single-flavor spirit extractions.", gmaps: "https://www.google.com/maps/search/?api=1&query=WA-SHU+Taipei" },
            { name: "Bar Mood 吧沐 🍸", category: "Cocktail Bars & Speakeasies", lat: 25.0426, lng: 121.5458, desc: "World-class cocktail bar ranked among Asia's 50 Best Bars.", gmaps: "https://www.google.com/maps/search/?api=1&query=Bar+Mood+Taipei" },
            { name: "Draft Land 🍸", category: "Cocktail Bars & Speakeasies", lat: 25.0416, lng: 121.5513, desc: "Pioneering tap-cocktail bar serving craft drinks on draft.", gmaps: "https://www.google.com/maps/search/?api=1&query=Draft+Land+Taipei" },
            { name: "Sip Sip Bar & Restaurant 🍸", category: "Cocktail Bars & Speakeasies", lat: 25.0441, lng: 121.5295, desc: "Day-to-night bistro and cocktail space inside Huashan 1914 Park.", gmaps: "https://www.google.com/maps/search/?api=1&query=Sip+Sip+Bar+Restaurant+Taipei" },
            { name: "Addiction Aquatic Development (上引水產)", category: "Seafood & Japanese Dining", lat: 25.0667, lng: 121.5367, desc: "Vibrant seafood complex featuring standing sushi counters and chirashi.", gmaps: "https://www.google.com/maps/search/?api=1&query=Addiction+Aquatic+Development+Taipei" },
            { name: "Chirashi Don Specialty (三味食堂)", category: "Seafood & Japanese Dining", lat: 25.0408, lng: 121.5050, desc: "Famous spot for oversized fresh sashimi slices and rich chirashi bowls.", gmaps: "https://www.google.com/maps/search/?api=1&query=Sun+Way+Salmon+Sashimi+Ximending" },
            { name: "Handrolls Specialty Bar", category: "Seafood & Japanese Dining", lat: 25.0423, lng: 121.5471, desc: "Gourmet seaweed handroll counter with uni and fatty tuna.", gmaps: "https://www.google.com/maps/search/?api=1&query=Handroll+Bar+Da-an+Taipei" },
            { name: "TopOne Hotpot (頂紅風味小火鍋)", category: "Hotpot, Eats & Late-Night", lat: 25.0338, lng: 121.5642, desc: "Premium hotpot featuring rich broth bases and marbled beef.", gmaps: "https://www.google.com/maps/search/?api=1&query=TopOne+Hotpot+Taipei" },
            { name: "Century Egg Noodles (劉漣麵)", category: "Hotpot, Eats & Late-Night", lat: 24.9789, lng: 121.5414, desc: "Tossed noodles coated in rich century egg sauce and minced pork chili.", gmaps: "https://www.google.com/maps/search/?api=1&query=%E5%8A%89%E6%BC%A3%E9%BA%B5+%E6%96%B0%E5%BA%97" },
            { name: "Weekend Chicken Club (週末炸雞俱樂部)", category: "Hotpot, Eats & Late-Night", lat: 25.0305, lng: 121.5552, desc: "Trendy late-night spot serving Taiwanese fried chicken and sandos.", gmaps: "https://www.google.com/maps/search/?api=1&query=Weekend+Chicken+Club+Taipei" },
            { name: "Steakhouse Destination (Smith & Wollensky)", category: "Hotpot, Eats & Late-Night", lat: 25.0354, lng: 121.5662, desc: "High-end steakhouse requiring advance reservations.", gmaps: "https://www.google.com/maps/search/?api=1&query=Smith+Wollensky+Taipei" },
            { name: "Huashan 1914 Creative Park", category: "Sights & Attractions", lat: 25.0441, lng: 121.5294, desc: "Former sake winery turned into art pop-ups and design shops.", gmaps: "https://www.google.com/maps/search/?api=1&query=Huashan+1914+Creative+Park" },
            { name: "Ximending Walking District", category: "Sights & Attractions", lat: 25.0422, lng: 121.5080, desc: "Pedestrian shopping district packed with streetwear and street food.", gmaps: "https://www.google.com/maps/search/?api=1&query=Ximending+Walking+District" },
            { name: "Raohe Night Market (饒河街觀光夜市)", category: "Sights & Attractions", lat: 25.0509, lng: 121.5775, desc: "Classic night market famous for pepper buns and herbal pork ribs.", gmaps: "https://www.google.com/maps/search/?api=1&query=Raohe+Street+Night+Market" },
            { name: "Maokong Gondola to Tea Village", category: "Sights & Attractions", lat: 24.9683, lng: 121.5882, desc: "Cable car route up to Maokong tea plantations.", gmaps: "https://www.google.com/maps/search/?api=1&query=Maokong+Gondola" },
            { name: "EasyCard Transit Hub", category: "Wellness & Transit", lat: 25.0478, lng: 121.5170, desc: "Point to pick up and reload EasyCards for Metro and YouBike.", gmaps: "https://www.google.com/maps/search/?api=1&query=Taipei+Main+Station" },
            { name: "Taipei Massage Center", category: "Wellness & Transit", lat: 25.0435, lng: 121.5440, desc: "Traditional Taiwanese foot reflexology and full-body massage parlor.", gmaps: "https://www.google.com/maps/search/?api=1&query=Six+Star+Foot+Massage+Taipei" },
            { name: "Hair Salon & Head Spa", category: "Wellness & Transit", lat: 25.0438, lng: 121.5452, desc: "Taiwanese hair salon offering head massages and blowouts.", gmaps: "https://www.google.com/maps/search/?api=1&query=Hair+Salon+Daan+Taipei" }
        ];

        // Init Map
        const map = L.map('map', { zoomControl: false }).setView([25.0380, 121.5480], 13);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 18
        }).addTo(map);

        const markers = [];
        const listContainer = document.getElementById('place-list');

        places.forEach((place, index) => {
            let markerIcon;
            if (place.category === "Hotel") {
                markerIcon = L.divIcon({
                    className: 'gold-star-marker',
                    html: '<i class="fa-solid fa-star"></i>',
                    iconSize: [32, 32], iconAnchor: [16, 16], popupAnchor: [0, -16]
                });
            } else {
                const color = categoryColors[place.category] || "#34495E";
                const iconClass = categoryIcons[place.category] || "fa-location-dot";
                markerIcon = L.divIcon({
                    className: 'custom-pin-wrap',
                    html: `<div class="custom-pin" style="background-color: ${color};"><i class="fa-solid ${iconClass}"></i></div>`,
                    iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -14]
                });
            }

            const marker = L.marker([place.lat, place.lng], { icon: markerIcon, zIndexOffset: place.category === "Hotel" ? 1000 : 100 }).addTo(map);
            marker.bindPopup(`
                <div style="font-family: sans-serif; max-width: 200px;">
                    <div class="popup-title">${place.name}</div>
                    <div class="popup-desc">${place.desc}</div>
                    <a href="${place.gmaps}" target="_blank" rel="noopener noreferrer" class="gmaps-link">Open in Google Maps ➔</a>
                </div>
            `);

            markers.push({ category: place.category, marker: marker, elementId: `item-${index}` });

            const item = document.createElement('div');
            item.className = 'place-item';
            item.id = `item-${index}`;
            item.onclick = () => {
                map.flyTo([place.lat, place.lng], 16, { duration: 0.8 });
                marker.openPopup();
            };
            const catColor = categoryColors[place.category] || "#34495E";
            item.innerHTML = `
                <h4>${place.name}</h4>
                <p>${place.desc}</p>
                <span class="category-badge" style="background-color: ${catColor};">${place.category}</span>
            `;
            listContainer.appendChild(item);
        });

        function filterCategory(category) {
            markers.forEach(item => {
                const elem = document.getElementById(item.elementId);
                if (category === "ALL" || item.category === category) {
                    item.marker.addTo(map);
                    elem.style.display = "block";
                } else {
                    map.removeLayer(item.marker);
                    elem.style.display = "none";
                }
            });
        }

        // Touch & Mouse Drag Resizing Logic for Mobile Drawer
        const dragHandle = document.getElementById('drag-handle');
        const listPanel = document.getElementById('list-panel');
        let isDragging = false;

        function startDrag(e) {
            isDragging = true;
            document.body.style.userSelect = 'none';
        }

        function doDrag(e) {
            if (!isDragging) return;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const containerHeight = window.innerHeight;
            let newPanelHeight = containerHeight - clientY;
            
            // Constrain between 15% and 75% of screen height
            const minH = containerHeight * 0.15;
            const maxH = containerHeight * 0.75;
            
            if (newPanelHeight >= minH && newPanelHeight <= maxH) {
                listPanel.style.height = `${newPanelHeight}px`;
                map.invalidateSize();
            }
        }

        function stopDrag() {
            if (isDragging) {
                isDragging = false;
                document.body.style.userSelect = '';
                map.invalidateSize();
            }
        }

        dragHandle.addEventListener('mousedown', startDrag);
        dragHandle.addEventListener('touchstart', startDrag, { passive: true });
        window.addEventListener('mousemove', doDrag);
        window.addEventListener('touchmove', doDrag, { passive: true });
        window.addEventListener('mouseup', stopDrag);
        window.addEventListener('touchend', stopDrag);

        // Geolocation
        let userMarker = null, userCircle = null;
        function locateUser() {
            if (!navigator.geolocation) return alert("Geolocation not supported");
            navigator.geolocation.getCurrentPosition((pos) => {
                const lat = pos.coords.latitude, lng = pos.coords.longitude;
                if (userMarker) map.removeLayer(userMarker);
                if (userCircle) map.removeLayer(userCircle);
                userCircle = L.circle([lat, lng], { radius: pos.coords.accuracy, color: '#1A73E8', fillColor: '#1A73E8', fillOpacity: 0.15 }).addTo(map);
                userMarker = L.circleMarker([lat, lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#1A73E8', fillOpacity: 1 }).addTo(map).bindPopup("<b>You are here</b>").openPopup();
                map.flyTo([lat, lng], 15);
            }, () => alert("Location permission denied."));
        }
    </script>
</body>
</html>
